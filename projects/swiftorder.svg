<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Red Logo Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#b71c1c" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b71c1c" />
      <stop offset="100%" stop-color="#f4511e" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Central Card Container -->
  <g transform="translate(140, 50)" filter="url(#dropShadow)">
    <rect width="520" height="500" rx="36" fill="#ffffff" />

    <!-- LOGO ICON GROUP -->
    <g transform="translate(110, 50)">
      <!-- Speed lines on left -->
      <g fill="#e53935">
        <rect x="0" y="115" width="30" height="8" rx="4" />
        <rect x="0" y="135" width="45" height="8" rx="4" />
        <rect x="0" y="155" width="60" height="8" rx="4" />
        <rect x="0" y="175" width="35" height="8" rx="4" />
      </g>

      <!-- Red 'S' Blob / Shape -->
      <path d="M 120 70
               C 70 70, 50 100, 50 130
               C 50 160, 80 180, 140 190
               C 210 200, 240 220, 240 260
               C 240 300, 190 320, 130 320
               C 70 320, 45 295, 45 295
               L 65 270
               C 65 270, 85 290, 130 290
               C 170 290, 200 275, 200 255
               C 200 235, 170 220, 120 210
               C 60 195, 30 170, 30 130
               C 30 85, 80 45, 150 45
               C 220 45, 270 85, 270 140
               L 240 140
               C 240 100, 200 70, 120 70 Z"
             fill="url(#redGrad)" />

      <!-- Food Cloche (Dome) on top of 'S' -->
      <g transform="translate(95, 65)">
        <!-- Dome lid -->
        <path d="M 20 45 A 35 35 0 0 1 90 45 Z" fill="#ffffff" />
        <!-- Handle on top -->
        <path d="M 50 10 Q 55 5 60 10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        <rect x="52" y="8" width="16" height="5" rx="2.5" fill="#ffffff" />
        <!-- Base plate -->
        <rect x="5" y="47" width="100" height="8" rx="4" fill="#ffffff" />
      </g>

      <!-- KOT Receipt / Bill Paper scrolling out to the right -->
      <g transform="translate(200, 185)">
        <path d="M 0 0 L 95 0 L 115 130 L 85 140 L 75 132 L 65 140 L 35 135 L 20 120 Z" fill="#ffffff" filter="url(#dropShadow)" />
        <rect x="15" y="0" width="85" height="135" rx="4" fill="#ffffff" />
        <!-- KOT Header -->
        <text x="57" y="28" font-family="'Poppins', sans-serif" font-size="16" font-weight="800" fill="#b71c1c" text-anchor="middle">KOT</text>
        <!-- Lines on receipt -->
        <line x1="25" y1="42" x2="85" y2="42" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round" />
        <line x1="25" y1="56" x2="75" y2="56" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round" />
        <line x1="25" y1="70" x2="80" y2="70" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round" />
        <line x1="25" y1="84" x2="65" y2="84" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round" />
        <line x1="25" y1="98" x2="85" y2="98" stroke="#bdbdbd" stroke-dasharray="3,3" stroke-width="1.5" />
        <!-- Rupee Symbol -->
        <text x="57" y="122" font-family="'Poppins', sans-serif" font-size="20" font-weight="800" fill="#e53935" text-anchor="middle">₹</text>
        <!-- Jagged bottom edge simulation -->
        <path d="M 15 135 L 22 142 L 30 135 L 38 142 L 45 135 L 53 142 L 60 135 L 68 142 L 75 135 L 83 142 L 90 135" fill="none" stroke="#e0e0e0" stroke-width="2" />
      </g>
    </g>

    <!-- TYPOGRAPHY SECTION -->
    <g transform="translate(260, 400)">
      <!-- Speed lines before SwiftOrder 'S' -->
      <g fill="#b71c1c" transform="translate(-150, 0)">
        <rect x="0" y="0" width="18" height="4" rx="2" />
        <rect x="0" y="10" width="28" height="4" rx="2" />
        <rect x="0" y="20" width="20" height="4" rx="2" />
      </g>

      <!-- SwiftOrder Text -->
      <text x="0" y="22" font-family="'Poppins', sans-serif" font-size="46" font-weight="700" fill="url(#textGrad)" text-anchor="middle">
        <tspan fill="#b71c1c">S</tspan><tspan fill="#334155">wift</tspan><tspan fill="#f4511e">O</tspan><tspan fill="#334155">rder</tspan>
      </text>

      <!-- Subtitle: ORDERS • KOT • BILLING -->
      <g transform="translate(0, 52)">
        <line x1="-155" y1="0" x2="-105" y2="0" stroke="#b71c1c" stroke-width="1.5" />
        <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="3" text-anchor="middle">ORDERS • KOT • BILLING</text>
        <line x1="105" y1="0" x2="155" y2="0" stroke="#b71c1c" stroke-width="1.5" />
      </g>
    </g>
  </g>
</svg>
